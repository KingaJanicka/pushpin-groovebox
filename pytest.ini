[pytest]
# Run from the project root so bare imports like `import definitions` and
# `from modes.melodic_mode import MelodicMode` resolve correctly.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is opt-in via the `cov` markers below; run with:
#   pytest --cov --cov-report=term-missing
addopts = -ra

filterwarnings =
    ignore::DeprecationWarning
