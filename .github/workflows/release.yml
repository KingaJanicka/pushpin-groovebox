name: Run tests

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Deps
        run: sudo apt install -y binfmt-support systemd-container
      - name: install SDM
        # Pinned: both the installer script and the release it installs.
        # Bump SDM_VERSION deliberately after checking the sdm changelog.
        env:
          SDM_VERSION: V16.1
        run: curl -fsSL "https://raw.githubusercontent.com/gitbls/sdm/${SDM_VERSION}/install-sdm" | bash -s -- "${SDM_VERSION}"
      - name: get hash
        id: get_sha
        run: echo "sha=$(git rev-parse --short HEAD)"  >> "$GITHUB_OUTPUT"
      - name: generate build name
        id: get_buildname
        run: echo "IMAGE=pushpin-groovebox_${{ github.ref_name }}.img" >> "$GITHUB_OUTPUT"
      - name: build image
        working-directory: ./scripts/image
        run: bash create-image-with-backports.sh
        env:
          IMAGE: ${{ steps.get_buildname.outputs.IMAGE }}
          # Install the tag being released, not GitHub's default branch.
          PUSHPIN_REF: ${{ github.ref_name }}
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: "./scripts/image/${{ steps.get_buildname.outputs.IMAGE }}"
          target: images
          strip_components: 1
